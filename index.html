<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9e9">
  <meta name="description" content="每日新聞選取與早安文字生成工具">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="News">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>News｜每日新聞</title>
  <link rel="icon" href="news-icon-v2.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="news-icon-v2.png" sizes="192x192">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <div>
        <p class="eyebrow">DAILY NEWS</p>
        <p class="hero__sub">
          <span>挑選今天的天氣、即時、金融、房市新聞</span>
          <span class="hero__sub-line">一鍵生成可直接分享的早安文字。</span>
        </p>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="status-card" aria-live="polite">
      <div>
        <span class="status-label">新聞日期</span>
        <strong id="newsDate">讀取中…</strong>
      </div>
      <div>
        <span class="status-label">🟢 新聞最後更新</span>
        <strong id="updatedAt">—</strong>
      </div>
      <div>
        <span class="status-label">已選新聞</span>
        <strong><span id="selectedCount">0</span> 篇</strong>
      </div>
    </section>

    <section class="news-grid">
      <article class="news-panel" data-category="weather">
        <div class="panel-head" role="button" tabindex="0" aria-expanded="true">
          <div>
            <span class="panel-icon">🌦️</span>
            <div>
              <h2>天氣</h2>
              <p>今日天氣新聞</p>
            </div>
          </div>
          <div class="panel-actions">
            <span id="weatherCount" class="count-badge">0</span>
            <span class="collapse-icon" aria-hidden="true">⌃</span>
          </div>
        </div>
        <div id="weatherList" class="news-list"></div>
      </article>

      <article class="news-panel" data-category="instant">
        <div class="panel-head" role="button" tabindex="0" aria-expanded="true">
          <div>
            <span class="panel-icon">⚡</span>
            <div>
              <h2>即時</h2>
              <p>今日最新新聞</p>
            </div>
          </div>
          <div class="panel-actions">
            <span id="instantCount" class="count-badge">0</span>
            <span class="collapse-icon" aria-hidden="true">⌃</span>
          </div>
        </div>
        <div id="instantList" class="news-list"></div>
      </article>

      <article class="news-panel" data-category="finance">
        <div class="panel-head" role="button" tabindex="0" aria-expanded="true">
          <div>
            <span class="panel-icon">💹</span>
            <div>
              <h2>金融</h2>
              <p>今日金融新聞</p>
            </div>
          </div>
          <div class="panel-actions">
            <span id="financeCount" class="count-badge">0</span>
            <span class="collapse-icon" aria-hidden="true">⌃</span>
          </div>
        </div>
        <div id="financeList" class="news-list"></div>
      </article>

      <article class="news-panel" data-category="housing">
        <div class="panel-head" role="button" tabindex="0" aria-expanded="true">
          <div>
            <span class="panel-icon">🏠</span>
            <div>
              <h2>房市</h2>
              <p>今日房市新聞</p>
            </div>
          </div>
          <div class="panel-actions">
            <span id="housingCount" class="count-badge">0</span>
            <span class="collapse-icon" aria-hidden="true">⌃</span>
          </div>
        </div>
        <div id="housingList" class="news-list"></div>
      </article>
    </section>

    <section class="generator">
      <div class="generator__head">
        <div>
          <p class="eyebrow">MESSAGE BUILDER</p>
          <h2>生成今日分享文字</h2>
          <p>每個分類最多選 1 篇；最多可同時選 4 篇。</p>
        </div>
        <button id="generateBtn" class="primary-btn" type="button">生成文字</button>
      </div>

      <div id="outputWrap" class="output-wrap" hidden>
        <textarea id="outputText" spellcheck="false" aria-label="生成文字"></textarea>
        <div class="output-actions">
          <span id="copyStatus" aria-live="polite"></span>
          <button id="copyBtn" class="secondary-btn" type="button">複製全文</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>資料來源：經濟日報、聯合新聞網、udn 房地產、風傳媒、TVBS、中時新聞網。文章內容與發布時間以原網站為準。</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
