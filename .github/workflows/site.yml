name: News worker and deploy Pages

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-news-pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.refresh_gate.outputs.run }}
      reason: ${{ steps.refresh_gate.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether refresh is needed
        id: refresh_gate
        run: python3 scripts/should_refresh.py

      - name: Gate decision
        run: echo "Refresh=${{ steps.refresh_gate.outputs.run }} — ${{ steps.refresh_gate.outputs.reason }}"

  update-and-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's core news
        run: timeout 240s python scripts/fetch_news.py

      - name: Add MyHousing and dedupe similar headlines
        continue-on-error: true
        run: timeout 90s python scripts/augment_myhousing.py

      - name: Add Liberty Times sources
        continue-on-error: true
        run: timeout 90s python scripts/augment_ltn.py

      - name: Add ETtoday housing source
        continue-on-error: true
        run: timeout 90s python scripts/augment_ettoday.py

      - name: Add FBS housing source
        continue-on-error: true
        run: timeout 90s python scripts/augment_fbs.py

      - name: Remove malformed news
        run: python scripts/sanitize_news.py

      - name: Validate generated news before publishing
        run: python scripts/validate_news.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html app.js styles.css news.json manifest.webmanifest .nojekyll _site/
          base64 --decode news-icon-v2.png.b64 > _site/news-icon-v2.png
          cp _site/news-icon-v2.png _site/apple-touch-icon.png
          cp _site/news-icon-v2.png _site/apple-touch-icon-precomposed.png
          cp _site/news-icon-v2.png _site/favicon.png
          python scripts/build_og.py _site/news-icon-v2.png _site/og-preview-v6.jpg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
