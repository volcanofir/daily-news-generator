name: Update news and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions cron uses UTC. Taiwan is UTC+8.
    # Keep the real runs off common boundaries; the UI can still show rounded times.
    # Morning start: 06:05 / 07:05, with a backup attempt 7 minutes later.
    - cron: "5,12 22,23 * * *"
    # 08:05-11:55 every 10 minutes for resilience if one cron is delayed/skipped.
    - cron: "5,15,25,35,45,55 0-3 * * *"
    # 12:05, with a backup attempt at 12:12.
    - cron: "5,12 4 * * *"
    # 15:05 / 18:05 / 21:05, with backup attempts at :12.
    - cron: "5,12 7,10,13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-news-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's news
        run: python scripts/fetch_news.py

      - name: Add MyHousing and dedupe similar headlines
        run: python scripts/augment_myhousing.py

      - name: Add Liberty Times sources
        run: python scripts/augment_ltn.py

      - name: Add ETtoday housing source
        run: python scripts/augment_ettoday.py

      - name: Add FBS housing source
        run: python scripts/augment_fbs.py

      - name: Remove malformed news
        run: python scripts/sanitize_news.py

      # Do not commit generated news.json back to main here.
      # A data commit starts GitHub's branch-based Pages deployment and can race this
      # custom Pages deployment. The freshly generated file is deployed directly below.

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html app.js styles.css news.json manifest.webmanifest .nojekyll _site/
          base64 --decode news-icon-v2.png.b64 > _site/news-icon-v2.png
          cp _site/news-icon-v2.png _site/apple-touch-icon.png
          cp _site/news-icon-v2.png _site/apple-touch-icon-precomposed.png
          cp _site/news-icon-v2.png _site/favicon.png

          # LINE link previews are more reliable with a large landscape OG image.
          if command -v magick >/dev/null 2>&1; then
            magick _site/news-icon-v2.png -resize 520x520 -background "#f4d230" -gravity center -extent 1200x630 -quality 88 _site/og-preview-v6.jpg
          elif command -v convert >/dev/null 2>&1; then
            convert _site/news-icon-v2.png -resize 520x520 -background "#f4d230" -gravity center -extent 1200x630 -quality 88 _site/og-preview-v6.jpg
          else
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
            convert _site/news-icon-v2.png -resize 520x520 -background "#f4d230" -gravity center -extent 1200x630 -quality 88 _site/og-preview-v6.jpg
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
