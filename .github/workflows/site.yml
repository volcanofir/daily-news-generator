name: Update news and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # GitHub scheduled events are best-effort and can be delayed/dropped.
    # Check every 5 minutes during active Taiwan-time hours; a lightweight gate
    # only allows a full scrape when the live site is stale enough.
    # UTC hours below = TW 06-12, 15, 18, 21.
    - cron: "*/5 0-4,7,10,13,22-23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-news-pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.refresh_gate.outputs.run }}
      reason: ${{ steps.refresh_gate.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether refresh is needed
        id: refresh_gate
        run: python3 scripts/should_refresh.py

      - name: Gate decision
        run: echo "Refresh=${{ steps.refresh_gate.outputs.run }} — ${{ steps.refresh_gate.outputs.reason }}"

  update-and-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's news
        run: python scripts/fetch_news.py

      - name: Add MyHousing and dedupe similar headlines
        run: python scripts/augment_myhousing.py

      - name: Add Liberty Times sources
        run: python scripts/augment_ltn.py

      - name: Add ETtoday housing source
        run: python scripts/augment_ettoday.py

      - name: Add FBS housing source
        run: python scripts/augment_fbs.py

      - name: Remove malformed news
        run: python scripts/sanitize_news.py

      # Deploy the freshly generated news.json directly from the artifact.
      # Do not commit generated data back to main; that would start GitHub's
      # branch-based Pages deployment and can race this custom deployment.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html app.js styles.css news.json manifest.webmanifest .nojekyll _site/
          base64 --decode news-icon-v2.png.b64 > _site/news-icon-v2.png
          cp _site/news-icon-v2.png _site/apple-touch-icon.png
          cp _site/news-icon-v2.png _site/apple-touch-icon-precomposed.png
          cp _site/news-icon-v2.png _site/favicon.png

          # LINE link previews are more reliable with a large landscape OG image.
          if command -v magick >/dev/null 2>&1; then
            magick _site/news-icon-v2.png -resize 520x520 -background "#f4d230" -gravity center -extent 1200x630 -quality 88 _site/og-preview-v6.jpg
          elif command -v convert >/dev/null 2>&1; then
            convert _site/news-icon-v2.png -resize 520x520 -background "#f4d230" -gravity center -extent 1200x630 -quality 88 _site/og-preview-v6.jpg
          else
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
            convert _site/news-icon-v2.png -resize 520x520 -background "#f4d230" -gravity center -extent 1200x630 -quality 88 _site/og-preview-v6.jpg
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
