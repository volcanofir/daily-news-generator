name: Update news and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions cron uses UTC. Taiwan is UTC+8.
    # 06:00, 07:00 Asia/Taipei
    - cron: "0 22,23 * * *"
    # 08:00-11:45 every 15 minutes Asia/Taipei
    - cron: "*/15 0-3 * * *"
    # 12:00 Asia/Taipei
    - cron: "0 4 * * *"
    # 15:00, 18:00, 21:00 Asia/Taipei
    - cron: "0 7,10,13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's news
        run: python scripts/fetch_news.py

      - name: Add MyHousing and dedupe similar headlines
        run: python scripts/augment_myhousing.py

      - name: Add Liberty Times sources
        run: python scripts/augment_ltn.py

      - name: Add ETtoday housing source
        run: python scripts/augment_ettoday.py

      - name: Remove malformed news
        run: python scripts/sanitize_news.py

      - name: Save refreshed news data
        run: |
          if ! git diff --quiet -- news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "chore: refresh today's news"
            git push
          else
            echo "No news.json change"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html app.js styles.css news.json manifest.webmanifest .nojekyll _site/
          base64 --decode news-icon-v2.png.b64 > _site/news-icon-v2.png
          cp _site/news-icon-v2.png _site/apple-touch-icon.png
          cp _site/news-icon-v2.png _site/apple-touch-icon-precomposed.png
          cp _site/news-icon-v2.png _site/favicon.png

          # LINE link previews are more reliable with a large landscape OG image.
          if command -v magick >/dev/null 2>&1; then
            magick _site/news-icon-v2.png -resize 520x520 -background "#f4d230" -gravity center -extent 1200x630 -quality 88 _site/og-preview-v6.jpg
          elif command -v convert >/dev/null 2>&1; then
            convert _site/news-icon-v2.png -resize 520x520 -background "#f4d230" -gravity center -extent 1200x630 -quality 88 _site/og-preview-v6.jpg
          else
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
            convert _site/news-icon-v2.png -resize 520x520 -background "#f4d230" -gravity center -extent 1200x630 -quality 88 _site/og-preview-v6.jpg
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
