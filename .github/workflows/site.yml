name: Update news

on:
  # A workflow-file edit also runs one immediate update, so we can verify
  # the updater itself without creating a news.json self-trigger loop.
  push:
    branches: [main]
    paths:
      - ".github/workflows/site.yml"
  schedule:
    # GitHub Actions cron uses UTC. Taiwan is UTC+8.
    # 06:00, 07:00 Asia/Taipei
    - cron: "0 22,23 * * *"
    # 08:00-11:45 every 15 minutes Asia/Taipei
    - cron: "*/15 0-3 * * *"
    # 12:00 Asia/Taipei
    - cron: "0 4 * * *"
    # 15:00, 18:00, 21:00 Asia/Taipei
    - cron: "0 7,10,13 * * *"
    # TEMP TEST: 23:00-23:45 every 15 minutes Asia/Taipei
    - cron: "*/15 15 * * *"
    # TEMP TEST: 24:00 Asia/Taipei
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's news
        run: python scripts/fetch_news.py

      - name: Add MyHousing and dedupe similar headlines
        run: python scripts/augment_myhousing.py

      - name: Add Liberty Times sources
        run: python scripts/augment_ltn.py

      - name: Add ETtoday housing source
        run: python scripts/augment_ettoday.py

      - name: Add FBS housing source
        run: python scripts/augment_fbs.py

      - name: Remove malformed news
        run: python scripts/sanitize_news.py

      - name: Generate static assets
        run: |
          base64 --decode news-icon-v2.png.b64 > news-icon-v2.png
          cp news-icon-v2.png apple-touch-icon.png
          cp news-icon-v2.png apple-touch-icon-precomposed.png
          cp news-icon-v2.png favicon.png

          if command -v magick >/dev/null 2>&1; then
            magick news-icon-v2.png -resize 520x520 -background "#f4d230" -gravity center -extent 1200x630 -quality 88 og-preview-v6.jpg
          elif command -v convert >/dev/null 2>&1; then
            convert news-icon-v2.png -resize 520x520 -background "#f4d230" -gravity center -extent 1200x630 -quality 88 og-preview-v6.jpg
          else
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
            convert news-icon-v2.png -resize 520x520 -background "#f4d230" -gravity center -extent 1200x630 -quality 88 og-preview-v6.jpg
          fi

      - name: Save refreshed site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json news-icon-v2.png apple-touch-icon.png apple-touch-icon-precomposed.png favicon.png og-preview-v6.jpg

          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh today's news"
            git push
          else
            echo "No site data change"
          fi
