name: News schedule primary

on:
  schedule:
    # Taiwan time: 06-12, 15, 18, 21. Primary heartbeat at :05/:15/:25/:35/:45/:55.
    - cron: "5,15,25,35,45,55 0-4,7,10,13,22-23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    uses: ./.github/workflows/site.yml
